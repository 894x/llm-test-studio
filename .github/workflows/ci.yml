name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.30.3"

jobs:
  go:
    name: Go checks (${{ matrix.group }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group: [desktop, remote, benchmarks, remaining]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Verify generated protocol contract
        run: go run ./scripts/generate-protocols -check
      - name: Run tests
        # Isolate database-heavy integration groups on separate runners.
        shell: pwsh
        run: |
          $modulePath = go list -m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $allTestPackages = @(go list ./...)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $desktopPrefix = "$modulePath/apps/desktop"
          $remotePackages = @(
            "$modulePath/internal/adapters/runnerhttp",
            "$modulePath/internal/application/jobhost"
          )
          $benchmarkPackages = @(
            "$modulePath/internal/application/benchmarks",
            "$modulePath/internal/benchmarkruntime"
          )
          $testPackages = @($allTestPackages | Where-Object {
            $desktop = $_ -eq $desktopPrefix -or $_.StartsWith("$desktopPrefix/")
            $remote = $remotePackages -contains $_
            $benchmark = $benchmarkPackages -contains $_
            switch ('${{ matrix.group }}') {
              'desktop' { $desktop }
              'remote' { $remote }
              'benchmarks' { $benchmark }
              'remaining' { -not $desktop -and -not $remote -and -not $benchmark }
            }
          })
          if ($testPackages.Count -eq 0) { throw 'The selected Go test group is empty' }
          Write-Output "Testing $($testPackages.Count) packages in ${{ matrix.group }}"
          go test @testPackages -p 1 -count=1 -timeout=20m
      - name: Run vet
        if: matrix.group == 'remaining'
        run: go vet ./...
      - name: Install vulnerability scanner
        if: matrix.group == 'remaining'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan Go dependencies
        if: matrix.group == 'remaining'
        run: govulncheck ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Go for the shared builtin catalog
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        # Serialize jsdom files so full-shell flows have the runner's CPU budget.
        run: pnpm test --maxWorkers=1 --testTimeout=10000
      - name: Run lint
        run: pnpm lint
      - name: Build frontend
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --registry https://registry.npmjs.org --prod --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository history
        run: gitleaks git --redact=100 --no-banner --log-opts="--all"
