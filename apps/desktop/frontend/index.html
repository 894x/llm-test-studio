<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="llm-studio 本地兼容性、质量与负载测试工作台"
    />
    <title>llm-studio</title>
    <script>
      (() => {
        const root = document.documentElement
        let languagePreference = "system"
        try {
          const savedLanguage = JSON.parse(
            localStorage.getItem("llm-studio:language-preference:v1") || "null",
          )
          if (
            savedLanguage?.version === 1 &&
            ["system", "zh-CN", "en-US"].includes(savedLanguage.language)
          ) {
            languagePreference = savedLanguage.language
          }
        } catch {
          // A corrupt optional preference must not block the desktop shell.
        }
        const systemLocale = navigator.languages
          .map((language) => language.trim().toLowerCase())
          .find((language) => language === "en" || language.startsWith("en-") || language === "zh" || language.startsWith("zh-"))
        const locale = languagePreference === "en-US" ||
          (languagePreference === "system" && systemLocale?.startsWith("en"))
          ? "en-US"
          : "zh-CN"
        root.setAttribute("lang", locale)
        root.setAttribute("dir", "ltr")

        let preference = "system"
        try {
          const saved = JSON.parse(
            localStorage.getItem("llm-studio:ui-preferences:v1") || "null",
          )
          if (
            saved?.version === 1 &&
            ["system", "light", "dark"].includes(saved.theme)
          ) {
            preference = saved.theme
          }
        } catch {
          // A corrupt optional preference must not block the desktop shell.
        }
        const resolved =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light"
        root.classList.toggle("dark", resolved === "dark")
        root.setAttribute("data-theme", resolved)
        root.setAttribute("data-theme-preference", preference)
        root.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
